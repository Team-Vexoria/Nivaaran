version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nivaaran
      POSTGRES_PASSWORD: nivaaran_password
      POSTGRES_DB: nivaaran_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://nivaaran:nivaaran_password@postgres:5432/nivaaran_db?schema=public
      - PORT=5000
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - postgres
    volumes:
      - ./prisma:/app/prisma
      - ./.env:/app/.env
    command: ["sh", "-c", "npx prisma migrate deploy || true && npm start"]

volumes:
  postgres_data:
